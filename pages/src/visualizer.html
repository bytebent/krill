<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>krill · visualizer</title>
<style>
/*KIT_CSS*/
.titlebar #name{min-width:160px;font-weight:700;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:280px}
.titlebar .stripes i:nth-child(1){background:var(--green)} .titlebar .stripes i:nth-child(2){background:var(--yellow)} .titlebar .stripes i:nth-child(3){background:var(--orange)}
.titlebar .stripes i:nth-child(4){background:var(--red)} .titlebar .stripes i:nth-child(5){background:var(--purple)} .titlebar .stripes i:nth-child(6){background:var(--blue)}
.titlebar a.gel{text-decoration:none}
.view.pondview{height:min(640px,72vh)}
.hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:12px var(--mono);color:var(--lcd);opacity:.7;letter-spacing:1px;pointer-events:none}
.hint[hidden]{display:none}
.player{display:flex;align-items:center;gap:10px;margin-top:8px}
.player audio{flex:1;height:30px}
.player[hidden]{display:none}
.time{font:700 12px var(--mono);min-width:120px;text-align:center;background:var(--inset);box-shadow:inset 0 1px 2px rgba(0,0,0,.3);border-radius:4px;padding:4px 8px}
</style>
</head>
<body>
<div class="window" role="application" aria-label="krill visualizer">
  <div class="titlebar">
    <span class="closebox" aria-hidden="true"></span>
    <span class="stripes" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></span>
    <h1>krill</h1><span class="sub">visualizer</span>
    <span class="lines"></span>
    <span id="name"></span>
    <span class="lines"></span>
    <a class="gel grey small" href="pond.html">Pond</a>
    <a class="gel grey small" href="creature.html">Creature</a>
  </div>
  <div class="body">
    <div class="screen">
      <div class="view pondview"><canvas class="base" id="vis" aria-label="The pond: each creature as a scope of its own voice, left to right as you hear it"></canvas><div class="hint" id="hint">PRESS PLAY</div></div>
      <div class="readouts" id="ro" aria-live="off"></div>
    </div>
    <div class="player" id="player" hidden><audio id="audio" controls preload="metadata"></audio></div>
    <div class="actions">
      <button class="gel" id="play" type="button">Play</button>
      <span class="time" id="time">0:00</span>
      <span id="lenBox"></span>
      <span class="sep"></span>
      <button class="gel grey small" id="fromPond" type="button" title="The pond you were working on in the pond page">Pond page&#x2019;s pond</button>
      <button class="gel grey small" id="example" type="button">Example pond</button>
      <button class="gel grey small" id="load" type="button" title="A pond file, or a WAV exported by krill">Load&#x2026;</button>
      <span class="status" id="status" role="status" aria-live="polite"></span>
    </div>
  </div>
</div>
<input type="file" id="file" accept=".json,application/json,.wav,audio/wav,audio/x-wav" hidden>
<script type="text/plain" id="worklet-src">/*WORKLET*/</script>
<script>/*MAIN*/</script>
</body>
</html>
