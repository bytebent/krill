<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>krill · pond</title>
<style>
:root{
  --platinum:#dcdce0; --platinum-hi:#ececef; --platinum-lo:#c4c4ca; --etch:#9c9ca4; --ink:#000; --ink-soft:#4a4a52; --inset:#f4f4f6; --desk:#b9b9c0;
  --green:#61bb46; --yellow:#fdb827; --orange:#f5821f; --red:#e03a3e; --purple:#963d97; --blue:#009ddc;
  --red-dk:#9e1f23; --blue-dk:#00699a; --purple-dk:#6a2a6b; --graphite:#6e6e78;
  --screen:#0b0b0e; --lcd:#8f8;
  --ui:"Lucida Grande","Lucida Sans Unicode",Geneva,Verdana,sans-serif; --mono:Monaco,"Courier New",monospace;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:radial-gradient(circle at 1px 1px, rgba(0,0,0,.09) 1px, transparent 1.5px) 0 0/6px 6px, var(--desk);
  font:13px/1.45 var(--ui); color:var(--ink); padding:20px 16px 0; min-height:100vh; min-width:960px}   /* desktop only */
button,input,select{font-family:var(--ui)}
.window{max-width:1040px;margin:0 auto;border:1px solid #7d7d86;border-radius:9px;overflow:clip;
  background:repeating-linear-gradient(0deg, rgba(255,255,255,.55) 0 1px, rgba(255,255,255,0) 1px 2px, rgba(0,0,0,.035) 2px 3px, rgba(0,0,0,0) 3px 4px), var(--platinum);
  box-shadow:0 1px 0 #fff inset, 0 12px 32px rgba(0,0,0,.22)}
.titlebar{display:flex;align-items:center;gap:12px;padding:9px 14px 8px;background:linear-gradient(#f6f6f8,#d6d6db);border-bottom:1px solid #8e8e96;flex-wrap:wrap}
.closebox{width:12px;height:12px;border:1px solid #6e6e78;border-radius:2px;background:linear-gradient(#fff,#cfcfd5);flex:none}
.titlebar .lines{flex:1;height:9px;background:repeating-linear-gradient(0deg,#9c9ca4 0 1px,transparent 1px 3px);opacity:.6;min-width:12px}
.titlebar h1{margin:0;font-size:15px;font-weight:700;letter-spacing:-.2px;white-space:nowrap}
.titlebar .sub{color:var(--ink-soft);font-size:11px;white-space:nowrap}
.stripes{display:inline-flex;width:22px;height:18px;border-radius:3px;overflow:hidden;box-shadow:0 0 0 1px rgba(0,0,0,.35);flex:none}
.stripes i{flex:1}
.body{padding:14px 18px 16px}

/* LCD */
.screen{background:var(--screen);border-radius:6px;padding:10px;box-shadow:0 0 0 1px #000,0 2px 6px rgba(0,0,0,.5) inset;position:relative}
.views{display:grid;grid-template-columns:3fr 2fr;gap:10px}
.view{position:relative;height:220px}
.view canvas{position:absolute;inset:0;width:100%;height:100%;border-radius:3px;display:block}
.view canvas.base{background:#060608}
.view .lbl{position:absolute;left:8px;top:6px;font:10px/1 var(--mono);color:var(--lcd);opacity:.8;letter-spacing:1px;pointer-events:none}
.readouts{display:flex;flex-wrap:wrap;gap:4px 18px;font:11px/1 var(--mono);color:var(--lcd);margin-top:8px;letter-spacing:1px;min-height:11px}
.readouts b{font-weight:400;opacity:.6;margin-right:6px}

/* groups */
.rows{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px;align-items:stretch}
fieldset{flex:1 1 300px;margin:0;border:1px solid var(--etch);border-radius:6px;padding:8px 12px 10px;background:rgba(236,236,239,.7);box-shadow:0 1px 0 #fff, inset 0 1px 0 #fff;min-width:0}
fieldset[disabled]{opacity:.45}
legend{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;padding:0 6px;display:flex;align-items:center;gap:6px}
legend .dot{width:8px;height:8px;border-radius:50%;background:var(--graphite);box-shadow:0 0 0 1px rgba(0,0,0,.35) inset}
.section{margin-top:16px;display:flex;align-items:center;gap:10px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px}
.section .rule{flex:1;height:2px;border-radius:2px;background:var(--etch);opacity:.6}
.section .dot{width:10px;height:10px;border-radius:50%;box-shadow:0 0 0 1px rgba(0,0,0,.35) inset}
.note{font-size:11px;color:var(--ink-soft);margin:4px 0 0}

/* knobs */
.knobs{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:flex-end;justify-content:space-around}
.knob{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;width:66px}
.dial{--a0:0deg;--a1:0deg;--c:var(--graphite);position:relative;width:44px;height:44px;border-radius:50%;cursor:ns-resize;touch-action:none;outline:none;
  background:conic-gradient(from 225deg, #b9b9c0 0 var(--a0), var(--c) var(--a0) var(--a1), #b9b9c0 var(--a1) 270deg, transparent 270deg)}
.dial::before{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--platinum-hi)}
.dial .cap{position:absolute;inset:6px;border-radius:50%;
  background:radial-gradient(circle at 50% 22%, rgba(255,255,255,.95) 0 18%, rgba(255,255,255,0) 46%), radial-gradient(circle at 50% 80%, #f7f7fa, #c8c8ce 60%, #9a9aa3);
  box-shadow:0 2px 3px rgba(0,0,0,.35), 0 0 0 1px #7d7d86}
.dial .ptr{position:absolute;inset:6px;border-radius:50%;pointer-events:none}
.dial .ptr::after{content:"";position:absolute;left:50%;top:3px;width:3px;height:30%;margin-left:-1.5px;border-radius:2px;background:#1a1a1e}
.dial:focus-visible{box-shadow:0 0 0 2px var(--blue)}
.knob .name{font-weight:700;white-space:nowrap}
.val{font:700 10.5px var(--ui);background:var(--inset);box-shadow:inset 0 1px 2px rgba(0,0,0,.25);border-radius:3px;padding:1px 6px;min-width:52px;text-align:center;white-space:nowrap}

/* range sliders */
.ranges{display:flex;flex-direction:column;gap:5px}
.rng{display:grid;grid-template-columns:118px 1fr 112px;align-items:center;gap:10px;font-size:11.5px}
.rng .rname{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rng .val{min-width:0;font-variant-numeric:tabular-nums}
.track{--c:var(--graphite);position:relative;height:18px;touch-action:none;cursor:pointer}
.track::before{content:"";position:absolute;left:0;right:0;top:7px;height:4px;border-radius:2px;background:#b9b9c0;box-shadow:inset 0 1px 1px rgba(0,0,0,.3)}
.track .fill{position:absolute;top:6px;height:6px;border-radius:3px;background:var(--c);box-shadow:0 0 0 1px rgba(0,0,0,.25) inset;cursor:grab}
.track .h{position:absolute;top:1px;width:12px;height:16px;margin-left:-6px;border-radius:4px;outline:none;cursor:ew-resize;
  background:radial-gradient(circle at 50% 25%, rgba(255,255,255,.95) 0 20%, rgba(255,255,255,0) 55%), linear-gradient(#f7f7fa,#c8c8ce 60%,#9a9aa3);
  box-shadow:0 1px 2px rgba(0,0,0,.4), 0 0 0 1px #7d7d86}
.track .h:focus-visible{box-shadow:0 0 0 2px var(--blue)}
.track .tk{position:absolute;top:13px;width:1px;height:4px;background:var(--ink-soft);opacity:.5}
.rng.locked .fill{width:10px!important;margin-left:-5px;border-radius:50%;height:10px;top:4px}
.rng.locked .h.hi{display:none}
.rng.locked .val::before{content:"\25CF  ";color:var(--c,var(--graphite))}

/* segmented, gel, fields */
.seg{display:inline-flex;border:1px solid #7d7d86;border-radius:999px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.seg button{font:700 11px var(--ui);border:0;padding:4px 11px;cursor:pointer;color:#222;background:linear-gradient(#fff,#d8d8dd 48%,#c4c4ca 52%,#e6e6ea)}
.seg button+button{border-left:1px solid #9c9ca4}
.seg button[aria-pressed="true"]{color:#fff;text-shadow:0 -1px 0 rgba(0,0,0,.3);background:linear-gradient(#8fd8f7,var(--blue) 48%,#0086c0 52%,#38b8ea)}
.segwrap{display:flex;flex-direction:column;align-items:flex-start;gap:5px;font-size:11px;font-weight:700}
.gel{display:inline-flex;align-items:center;gap:6px;padding:6px 16px;border-radius:999px;font:700 12px var(--ui);color:#fff;border:1px solid var(--blue-dk);position:relative;cursor:pointer;white-space:nowrap;
  background:linear-gradient(#8fd8f7,var(--blue) 48%,#0086c0 52%,#38b8ea);box-shadow:0 2px 4px rgba(0,0,0,.3), 0 1px 0 rgba(255,255,255,.5) inset;text-shadow:0 -1px 0 rgba(0,0,0,.3)}
.gel::before{content:"";position:absolute;left:10px;right:10px;top:2px;height:45%;border-radius:999px;background:linear-gradient(rgba(255,255,255,.75),rgba(255,255,255,.1));pointer-events:none}
.gel.grey{color:#222;border-color:#7d7d86;text-shadow:0 1px 0 #fff;background:linear-gradient(#fff,#d8d8dd 48%,#c4c4ca 52%,#e6e6ea)}
.gel.small{padding:3px 12px;font-size:11px}
.gel:disabled{opacity:.5;cursor:default}
.gel:focus-visible,.seg button:focus-visible,.field:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.field{font:700 12px var(--ui);height:24px;padding:0 8px;border-radius:4px;border:1px solid #9c9ca4;background:var(--inset);box-shadow:inset 0 1px 2px rgba(0,0,0,.3);color:var(--ink)}
select.field{padding:0 4px}
.sq{width:24px;height:24px;padding:0;display:inline-flex;align-items:center;justify-content:center;border:1px solid #7d7d86;border-radius:4px;cursor:pointer;
  background:linear-gradient(#fff,#d8d8dd 48%,#c4c4ca 52%,#e6e6ea);box-shadow:0 1px 2px rgba(0,0,0,.2);font-size:13px}

/* vowel pad */
.padbox{display:flex;flex-direction:column;align-items:center;gap:6px}
.pad{display:block;width:280px;height:auto;touch-action:none;cursor:crosshair;outline:none;border-radius:4px}
.pad:focus-visible{box-shadow:0 0 0 2px var(--blue)}
.pad .face{fill:var(--inset);stroke:#7d7d86;stroke-width:1.2}
.pad .grid{stroke:#c4c4ca;stroke-width:1;fill:none}
.pad .v{font:12px var(--ui);fill:#8a8a93;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.pad .ax{font:700 8.5px var(--ui);fill:var(--ink-soft);letter-spacing:.8px;text-anchor:middle;pointer-events:none}
.pad .region{fill:rgba(150,61,151,.22);stroke:var(--purple);stroke-width:1.5;cursor:move}
.pad .corner{fill:#fff;stroke:var(--purple);stroke-width:1.5;cursor:nwse-resize}
.pad .pt{fill:var(--purple);stroke:#fff;stroke-width:1;pointer-events:none}

/* action bar, sticky at the bottom of the viewport */
.actions{position:sticky;bottom:0;z-index:5;margin:16px -18px -16px;padding:9px 18px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;
  background:linear-gradient(#f6f6f8,#d6d6db);border-top:1px solid #8e8e96;box-shadow:0 -2px 8px rgba(0,0,0,.12)}
.actions .sep{width:1px;height:22px;background:#9c9ca4;margin:0 2px}
.actions .status{flex:1 1 180px;text-align:right;font-size:11px;color:var(--ink-soft);min-width:0}
.actions .status.err{color:var(--red-dk);font-weight:700}
.menu{position:absolute;bottom:34px;left:0;min-width:220px;background:var(--platinum-hi);border:1px solid #7d7d86;border-radius:5px;box-shadow:0 8px 20px rgba(0,0,0,.3);padding:4px 0;z-index:10;font-size:12px}
.menu[hidden]{display:none}
.menu .it{display:block;width:100%;text-align:left;border:0;background:transparent;padding:4px 12px;cursor:pointer;font-size:12px}
.menu .it small{color:var(--ink-soft);margin-left:6px}
.menu .it:hover,.menu .it:focus-visible{background:var(--blue);color:#fff;outline:none}
.menu .it:hover small{color:#e8f6fc}
.wrapmenu{position:relative}
.progress{height:6px;width:120px;border-radius:3px;background:#b9b9c0;box-shadow:inset 0 1px 2px rgba(0,0,0,.3);overflow:hidden;display:none}
.progress i{display:block;height:100%;width:0;background:var(--blue)}
.dropping .window{box-shadow:0 0 0 3px var(--blue), 0 12px 32px rgba(0,0,0,.22)}

@media (prefers-reduced-motion:reduce){ *{transition:none!important} }

.titlebar #name{width:190px}
.titlebar #dirty{color:var(--purple);font-weight:700}
.titlebar .stripes i:nth-child(1){background:var(--green)} .titlebar .stripes i:nth-child(2){background:var(--yellow)} .titlebar .stripes i:nth-child(3){background:var(--orange)}
.titlebar .stripes i:nth-child(4){background:var(--red)} .titlebar .stripes i:nth-child(5){background:var(--purple)} .titlebar .stripes i:nth-child(6){background:var(--blue)}
.view.wide{height:250px}
.slots{display:flex;flex-direction:column;gap:6px}
.slot{display:grid;grid-template-columns:28px 170px 140px minmax(300px,1fr) auto;align-items:center;gap:10px;padding:5px 8px;border-radius:5px;background:rgba(255,255,255,.35);border:1px solid #c8c8ce}
.slot.empty{background:transparent;border-style:dashed}
.slot .led{width:14px;height:14px;border-radius:50%;box-shadow:0 0 0 1px rgba(0,0,0,.45) inset, 0 0 6px rgba(0,0,0,.15);justify-self:center}
.slot.empty .led{opacity:.3}
.slot .nm{font-weight:700;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .sp{font-size:11px;color:var(--ink-soft)}
.slot .btns{display:flex;gap:5px;align-items:center}
.slot .rng{grid-template-columns:64px 1fr 104px}
.slot select.field{width:120px}
#g-talk-r .rng{grid-template-columns:72px 1fr 112px}
.player{display:flex;align-items:center;gap:10px;margin-top:8px}
.player audio{flex:1;height:30px}
.player[hidden]{display:none}
#cmd{font:11px var(--mono);color:var(--ink-soft);user-select:all}
.lenbox{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700}
.lenbox input{width:64px}
.sheet-bg{position:fixed;inset:0;z-index:20;background:rgba(40,40,48,.35);display:flex;align-items:flex-start;justify-content:center;padding-top:90px}
.sheet-bg[hidden]{display:none}
.sheet{width:460px;border:1px solid #7d7d86;border-radius:9px;overflow:clip;background:var(--platinum,#e4e4e8);box-shadow:0 18px 50px rgba(0,0,0,.35)}
.sheet .titlebar h2{margin:0;font-size:13px;font-weight:700;white-space:nowrap}
.sheet .in{padding:14px 18px 6px;display:flex;flex-direction:column;gap:14px}
.sheet .line{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:11px;font-weight:700}
.sheet .line input.field{width:64px}
.sheet .knobs{justify-content:flex-start;gap:6px 18px;align-items:center}
.sheet label.chk{display:flex;align-items:center;gap:8px;font-size:12px}
.sheet .note{margin:0}
.sheet .foot{display:flex;align-items:center;gap:10px;padding:10px 18px 14px}
.sheet .foot .progress{flex:1;width:auto}
.sheet .foot .grow{flex:1}
</style>
</head>
<body>
<div class="window" role="application" aria-label="krill pond page">
  <div class="titlebar">
    <span class="closebox" aria-hidden="true"></span>
    <span class="stripes" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></span>
    <h1>krill</h1><span class="sub">pond</span>
    <span class="lines"></span>
    <input class="field" id="name" maxlength="40" aria-label="Pond name" spellcheck="false">
    <span id="dirty" title="Changed since it was saved or loaded" hidden>*</span>
    <span class="lines"></span>
    <a class="gel grey small" id="toVis" href="visualizer.html" style="text-decoration:none" title="Watch and hear this pond in the visualizer">Visualizer</a>
    <a class="gel grey small" id="toCreature" href="creature.html" style="text-decoration:none">Creature</a>
  </div>
  <div class="body">
    <div class="screen">
      <div class="view wide"><canvas class="base" id="sketch" aria-label="Sketch of the whole piece: calls per slot over time"></canvas><canvas id="sketchTop" aria-hidden="true"></canvas></div>
      <div class="readouts" id="ro" aria-live="off"></div>
    </div>
    <div class="player" id="player" hidden><audio id="audio" controls preload="auto"></audio><button class="gel grey small" id="dl" type="button">Download WAV</button></div>

    <div class="section"><span class="dot" style="background:var(--graphite)"></span>Slots<span class="rule"></span></div>
    <div class="slots" id="slots" style="margin-top:10px"></div>

    <div class="rows">
      <fieldset><legend><span class="dot"></span>Pitch</legend><div class="knobs" id="g-pitch" style="justify-content:flex-start;gap:16px;align-items:center"></div></fieldset>
      <fieldset><legend><span class="dot"></span>Talk</legend><div class="knobs" id="g-talk"></div><div class="ranges" id="g-talk-r" style="margin-top:8px"></div></fieldset>
      <fieldset><legend><span class="dot"></span>Space · Output</legend><div class="knobs" id="g-out"></div></fieldset>
    </div>

    <div class="actions">
      <button class="gel" id="export" type="button">Export&#x2026;</button>
      <button class="gel grey" id="render" type="button" title="Render up to the first 10 minutes to listen to here">Preview</button>
      <span class="progress" id="prog"><i></i></span>
      <span class="sep"></span>
      <span class="lenbox">Seed <input class="field" id="seed" type="number" min="1" step="1" aria-label="Seed"><button class="sq" id="dice" type="button" aria-label="Random seed" title="Random seed">&#x2684;</button></span>
      <span class="lenbox">Length <input class="field" id="minutes" type="number" min="0.1" max="600" step="0.5" aria-label="Length in minutes"> min</span>
      <span class="sep"></span>
      <button class="gel grey small" id="example" type="button">Example pond</button>
      <button class="gel grey small" id="new" type="button">New</button>
      <button class="gel grey small" id="load" type="button">Load&#x2026;</button>
      <button class="gel grey small" id="save" type="button">Save</button>
      <span class="status" id="status" role="status" aria-live="polite"></span>
    </div>
  </div>
</div>
<div class="sheet-bg" id="exportSheet" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="exTitle">
    <div class="titlebar"><span class="closebox" aria-hidden="true"></span><span class="lines"></span><h2 id="exTitle">Export</h2><span class="lines"></span></div>
    <div class="in">
      <div class="line"><span>Length</span><span id="exLenSeg"></span><input class="field" id="exMin" type="number" min="0.1" max="600" step="0.5" aria-label="Length in minutes"> min</div>
      <div class="knobs" id="exOut"></div>
      <label class="chk"><input type="checkbox" id="exPond" checked> Also save the pond file, to render this piece again</label>
      <p class="note" id="exNote"></p>
    </div>
    <div class="foot">
      <span class="progress" id="exProg"><i></i></span><span class="grow" id="exGrow"></span>
      <button class="gel grey small" id="exCancel" type="button">Cancel</button>
      <button class="gel" id="exGo" type="button">Export</button>
    </div>
  </div>
</div>
<input type="file" id="file" accept=".json,application/json,.wav,audio/wav,audio/x-wav" hidden>
<script type="text/plain" id="worker-src">// ---- vendor/throat-engine.js
/*
 * Throat engine v0.1 · bytebent
 *
 * A parametric larynx. It makes every sound in the Throat/Mouth pair:
 *   - glottal pulses from the LF (Liljencrants–Fant) model, shaped by Rd
 *     (pressed ← 0.3 … 1.0 modal … 2.7 → breathy), output as flow or flow derivative,
 *   - breath / turbulence noise, steady and pulsed by each glottal opening,
 *   - per-cycle irregularity (jitter, shimmer, creak) and subharmonics (growl).
 *
 * Pulses and noise run at 4x the host rate and are decimated with a windowed-sinc
 * FIR, so sharp (tense, high) pulses don't alias. process() never allocates.
 *
 * Works in an AudioWorklet and in Node (module.exports) for offline tests.
 */
(function (root) {
  'use strict';

  const OS = 4;                       // internal oversampling
  const TN = 2048;                    // table points per glottal period
  const TW = TN + 1;                  // stored row width (wrap point)
  const MIP_LEVELS = 9;               // harmonic limits 1024, 512, … 4 (band-limited copies)
  const RD_LO = 0.3, RD_HI = 2.7, RD_STEP = 0.05;
  const RD_COUNT = Math.round((RD_HI - RD_LO) / RD_STEP) + 1;   // 49
  const RD_MODAL = 1.0;
  const RD_SUB = 0.45;                // false-fold (growl) pulse shape
  const TABLE_RMS = 0.1;              // pulse level at modal voice
  const NORM_POW = 0.7;               // how much loudness is evened out across Rd
  const FIR_LEN = 128;                // decimation filter taps (at 4x rate)
  const BLOCK = 32;                   // fixed internal control block (host samples) = latency
  const MAX_VOICES = 8;

  /* ---------- LF model ---------- */

  // Solve the LF model for one Rd value. Period T0 = 1, excitation Ee = 1.
  function lfSolve(Rd) {
    const Ra = (-1 + 4.8 * Rd) / 100;
    const Rk = (22.4 + 11.8 * Rd) / 100;
    const Rg = 0.25 * Rk / (0.11 * Rd / (0.5 + 1.2 * Rk) - Ra);
    const Tp = 1 / (2 * Rg), Te = Tp * (1 + Rk), Ta = Ra;
    const d = 1 - Te;
    let eps = 1 / Ta;
    for (let i = 0; i < 300; i++) eps = (1 - Math.exp(-eps * d)) / Ta;
    const wg = Math.PI / Tp, sinTe = Math.sin(wg * Te), cosTe = Math.cos(wg * Te);
    const ed = Math.exp(-eps * d);
    const retArea = -((1 - ed) / eps - d * ed) / (eps * Ta);
    const openArea = a => (a * sinTe - wg * cosTe + wg * Math.exp(-a * Te)) * (-1 / sinTe) / (a * a + wg * wg);
    // total area must be zero (flow returns to its starting value); f(a) decreases with a
    let lo = -200, hi = 200;
    for (let i = 0; i < 200; i++) {
      const mid = 0.5 * (lo + hi);
      if (openArea(mid) + retArea > 0) lo = mid; else hi = mid;
    }
    const a = 0.5 * (lo + hi);
    return { Rd, Tp, Te, Ta, eps, a, wg, sinTe, ed, flowTe: openArea(a), area: openArea(a) + retArea };
  }

  // Flow and flow derivative at normalised time t in [0, 1].
  function lfEval(p, t, out) {
    if (t <= p.Te) {
      const e = Math.exp(p.a * (t - p.Te));
      const s = Math.sin(p.wg * t), c = Math.cos(p.wg * t);
      out[1] = -e * s / p.sinTe;
      out[0] = (e * (p.a * s - p.wg * c) + p.wg * Math.exp(-p.a * p.Te)) * (-1 / p.sinTe) / (p.a * p.a + p.wg * p.wg);
    } else {
      const u = t - p.Te, eu = Math.exp(-p.eps * u);
      out[1] = -(eu - p.ed) / (p.eps * p.Ta);
      out[0] = p.flowTe - ((1 - eu) / p.eps - u * p.ed) / (p.eps * p.Ta);
    }
  }

  /* ---------- tables (built once) ---------- */

  let TABLES = null;

  function rmsOf(arr, off, n, removeMean) {
    let m = 0;
    if (removeMean) { for (let i = 0; i < n; i++) m += arr[off + i]; m /= n; }
    let s = 0;
    for (let i = 0; i < n; i++) { const v = arr[off + i] - m; s += v * v; }
    return Math.sqrt(s / n);
  }

  function buildTables() {
    if (TABLES) return TABLES;
    const flowRaw = new Float64Array(RD_COUNT * TW);
    const derivRaw = new Float64Array(RD_COUNT * TW);
    const flow = new Float32Array(RD_COUNT * TW);
    const deriv = new Float32Array(RD_COUNT * TW);
    const shape = new Float32Array(RD_COUNT * TW);     // flow scaled to peak 1 (drives pulsed breath)
    const te = new Float32Array(RD_COUNT);              // open quotient per row
    const tmp = [0, 0];
    for (let r = 0; r < RD_COUNT; r++) {
      const p = lfSolve(RD_LO + r * RD_STEP);
      te[r] = p.Te;
      const o = r * TW;
      for (let i = 0; i < TN; i++) {
        lfEval(p, i / TN, tmp);
        flowRaw[o + i] = tmp[0];
        derivRaw[o + i] = tmp[1];
      }
      // tiny numerical residue: pin the period end to the start
      const endFlow = (lfEval(p, 1, tmp), tmp[0]);
      for (let i = 0; i < TN; i++) flowRaw[o + i] -= endFlow * (i / TN);
      flowRaw[o + TN] = flowRaw[o];
      derivRaw[o + TN] = derivRaw[o];
    }
    const ref = Math.round((RD_MODAL - RD_LO) / RD_STEP);
    const refF = rmsOf(flowRaw, ref * TW, TN, true), refD = rmsOf(derivRaw, ref * TW, TN, false);
    const flowMip = [], derivMip = [];
    for (let l = 0; l < MIP_LEVELS; l++) { flowMip.push(new Float32Array(RD_COUNT * TW)); derivMip.push(new Float32Array(RD_COUNT * TW)); }
    const re = new Float64Array(TN), im = new Float64Array(TN), sre = new Float64Array(TN), sim = new Float64Array(TN);
    for (let r = 0; r < RD_COUNT; r++) {
      const o = r * TW;
      const rf = rmsOf(flowRaw, o, TN, true), rd = rmsOf(derivRaw, o, TN, false);
      const gf = (TABLE_RMS / refF) * Math.pow(refF / rf, NORM_POW);
      const gd = (TABLE_RMS / refD) * Math.pow(refD / rd, NORM_POW);
      let peak = 0;
      for (let i = 0; i < TW; i++) peak = Math.max(peak, flowRaw[o + i]);
      for (let i = 0; i < TW; i++) {
        flow[o + i] = flowRaw[o + i] * gf;
        deriv[o + i] = derivRaw[o + i] * gd;
        shape[o + i] = Math.max(0, flowRaw[o + i] / peak);
      }
      // band-limited copies: keep harmonics 1..H, H = 1024 >> level
      for (let kind = 0; kind < 2; kind++) {
        const src = kind ? deriv : flow, dst = kind ? derivMip : flowMip;
        for (let i = 0; i < TN; i++) { sre[i] = src[o + i]; sim[i] = 0; }
        fft(sre, sim, false);
        for (let l = 0; l < MIP_LEVELS; l++) {
          const H = (TN / 2) >> l;
          for (let i = 0; i < TN; i++) { re[i] = 0; im[i] = 0; }
          re[0] = sre[0];
          for (let k = 1; k <= H && k < TN / 2; k++) {
            re[k] = sre[k]; im[k] = sim[k]; re[TN - k] = sre[TN - k]; im[TN - k] = sim[TN - k];
          }
          if (H >= TN / 2) { re[TN / 2] = sre[TN / 2]; }
          fft(re, im, true);
          const d = dst[l];
          for (let i = 0; i < TN; i++) d[o + i] = re[i] / TN;
          d[o + TN] = d[o];
        }
      }
    }
    // Thin: an almost-sine pulse (raised cosine flow over the whole period)
    const sFlow = new Float32Array(TW), sDeriv = new Float32Array(TW), sShape = new Float32Array(TW);
    for (let i = 0; i < TW; i++) {
      const t = i / TN;
      sShape[i] = 0.5 * (1 - Math.cos(2 * Math.PI * t));
      sFlow[i] = sShape[i];
      sDeriv[i] = Math.PI * Math.sin(2 * Math.PI * t);
    }
    const thinLevel = 0.8 * TABLE_RMS;
    const g1 = thinLevel / rmsOf(sFlow, 0, TN, true), g2 = thinLevel / rmsOf(sDeriv, 0, TN, false);
    for (let i = 0; i < TW; i++) { sFlow[i] *= g1; sDeriv[i] *= g2; }
    TABLES = { flow, deriv, shape, te, sFlow, sDeriv, sShape, flowMip, derivMip };
    return TABLES;
  }

  // in-place radix-2 FFT (table building only)
  function fft(re, im, inverse) {
    const n = re.length;
    for (let i = 1, j = 0; i < n; i++) {
      let bit = n >> 1;
      for (; j & bit; bit >>= 1) j ^= bit;
      j ^= bit;
      if (i < j) { let t = re[i]; re[i] = re[j]; re[j] = t; t = im[i]; im[i] = im[j]; im[j] = t; }
    }
    for (let len = 2; len <= n; len <<= 1) {
      const ang = (inverse ? 2 : -2) * Math.PI / len, wr = Math.cos(ang), wi = Math.sin(ang), h = len >> 1;
      for (let i = 0; i < n; i += len) {
        let cr = 1, ci = 0;
        for (let j = 0; j < h; j++) {
          const a = i + j, b = a + h;
          const vr = re[b] * cr - im[b] * ci, vi = re[b] * ci + im[b] * cr;
          re[b] = re[a] - vr; im[b] = im[a] - vi; re[a] += vr; im[a] += vi;
          const t = cr * wr - ci * wi; ci = cr * wi + ci * wr; cr = t;
        }
      }
    }
  }

  // pick the band-limited table for a pulse lasting `len` samples at the 4x rate:
  // harmonics may reach (4x rate − host Nyquist); above that they would fold into the audible band
  function mipLevel(len) {
    const maxH = len * (1 - 0.5 / OS);
    let l = 0, H = TN / 2;
    while (H > maxH && l < MIP_LEVELS - 1) { H >>= 1; l++; }
    return l;
  }

  /* ---------- decimation filter ---------- */

  function designFir() {
    const h = new Float32Array(FIR_LEN);
    const fc = 0.5 / OS;                // cutoff at the host Nyquist, in cycles per 4x sample
    const M = FIR_LEN - 1;
    let sum = 0;
    for (let i = 0; i < FIR_LEN; i++) {
      const x = i - M / 2;
      const sinc = x === 0 ? 2 * fc : Math.sin(2 * Math.PI * fc * x) / (Math.PI * x);
      const w = 0.42 - 0.5 * Math.cos(2 * Math.PI * i / M) + 0.08 * Math.cos(4 * Math.PI * i / M);
      h[i] = sinc * w;
      sum += h[i];
    }
    for (let i = 0; i < FIR_LEN; i++) h[i] /= sum;
    return h;
  }

  /* ---------- parameters ---------- */

  const PARAMS = {
    voicing:   { def: 1,     min: 0,    max: 1 },
    breathy:   { def: 0,     min: 0,    max: 1 },
    tense:     { def: 0,     min: 0,    max: 1 },
    creaky:    { def: 0,     min: 0,    max: 1 },
    thin:      { def: 0,     min: 0,    max: 1 },
    growl:     { def: 0,     min: 0,    max: 1 },
    jitter:    { def: 0,     min: 0,    max: 1 },
    shimmer:   { def: 0,     min: 0,    max: 1 },
    transpose: { def: 0,     min: -24,  max: 24 },     // semitones
    detune:    { def: 0,     min: -100, max: 100 },    // cents
    mode:      { def: 0,     min: 0,    max: 1 },      // 0 mono, 1 poly
    glide:     { def: 0.06,  min: 0,    max: 2 },      // seconds (mono only)
    attack:    { def: 0.02,  min: 0.001, max: 5 },
    decay:     { def: 0.3,   min: 0.001, max: 5 },
    sustain:   { def: 0.8,   min: 0,    max: 1 },
    release:   { def: 0.25,  min: 0.001, max: 8 },
    volume:    { def: -6,    min: -48,  max: 6 },      // dB
    source:    { def: 0,     min: 0,    max: 1 },      // 0 flow, 1 derivative
  };

  // Breath noise colour: soft /h/ = white low-passed at 2.5 kHz, bright whisper = white high-passed
  // at 1.8 kHz; both through a gentle 7 kHz roll-off. Gains level-match them (measured offline).
  const NOISE_SOFT_HZ = 2500, NOISE_BRIGHT_HZ = 1800, NOISE_AIR_HZ = 7000;
  const NOISE_SOFT_GAIN = 0.89, NOISE_BRIGHT_GAIN = 0.6;
  const ROUGH_HZ = 45;

  /* ---------- voice ---------- */

  class Voice {
    constructor(eng, seed) {
      this.e = eng;
      this.seed = seed >>> 0 || 1;
      this.rng = this.seed;
      this.reset();
    }
    reset() {
      this.stage = 0;            // 0 idle, 1 attack, 2 decay, 3 sustain, 4 release
      this.env = 0;
      this.note = -1;
      this.held = false;
      this.vel = 1;
      this.age = 0;
      this.logF = Math.log(110);
      this.glideLeft = 0;
      this.glideStep = 0;
      this.hasPitch = false;
      this.cyc = 0;              // samples (4x) elapsed in the current cycle
      this.per = 0;              // cycle length (4x samples, fractional)
      this.pulse = 1;            // open+return length inside the cycle
      this.inc = 1;
      this.cycleN = 0;
      this.amp = 1;
      this.ri = 0; this.rf = 0; this.sm = 0;
      this.tab = null; this.sTab = null; this.subTab = null;
      this.subPos = 0;
      this.n1 = 0; this.n2 = 0; this.n3 = 0; this.rough = 0;
      this.lastF0 = 0; this.lastRd = RD_MODAL; this.lastOq = 0;
    }
    rand() {
      let x = this.rng;
      x ^= x << 13; x ^= x >>> 17; x ^= x << 5;
      this.rng = x >>> 0;
      return this.rng / 4294967296;
    }
    gauss() { return (this.rand() + this.rand() + this.rand() + this.rand() - 2) * 1.7320508; }

    get active() { return this.stage !== 0; }

    setTarget(note, glide) {
      const target = Math.log(440) + (note - 69) * Math.LN2 / 12;
      this.note = note;
      const gs = this.e.p.glide;
      if (glide && gs > 0 && this.hasPitch) {
        this.glideLeft = Math.max(1, Math.round(gs * this.e.sr));
        this.glideStep = (target - this.logF) / this.glideLeft;
      } else {
        this.logF = target;
        this.glideLeft = 0;
      }
      this.hasPitch = true;
    }

    trigger(vel) {
      this.vel = vel;
      if (this.stage === 0) {     // starting from silence: begin a fresh cycle
        this.cyc = 0; this.per = 0; this.cycleN = 0; this.env = 0;
      }
      this.stage = 1;
      this.age = ++this.e.ageCounter;
    }

    release() { if (this.stage !== 0) this.stage = 4; }

    startCycle() {
      const e = this.e, P = e.p, T = e.tables;
      let f0 = Math.exp(this.logF + e.pitchLog);
      if (f0 < 20) f0 = 20; else if (f0 > 2500) f0 = 2500;
      const k = this.cycleN++;
      let per = e.srOS / f0;
      let amp = 1;
      if (P.jitter > 0) per *= 1 + P.jitter * 0.05 * this.gauss();
      const growl = e.s.growl, creak = e.s.creaky;
      if (growl > 0) {
        per *= 1 + ((k & 1) ? -1 : 1) * growl * 0.12;
        if (k & 1) amp *= 1 - 0.55 * growl;
      }
      let pulse = per;
      if (creak > 0) {
        pulse = per * (1 - 0.45 * creak);
        per = per * (1 + creak * 0.35 * Math.abs(this.gauss()));
        if (this.rand() < creak * 0.3) per *= 1.4 + this.rand() * 1.2 * creak;
        if (k & 1) amp *= 1 - 0.5 * creak * (0.6 + 0.4 * this.rand());
        amp *= 1 + 0.9 * creak;          // fewer pulses per second: keep fry roughly as loud
      }
      if (P.shimmer > 0) amp *= Math.exp(P.shimmer * 0.25 * this.gauss());
      if (pulse < 8) pulse = 8;
      if (per < pulse) per = pulse;

      // pulse shape for this cycle
      const rdx = (Math.exp(e.lnRd) - RD_LO) / RD_STEP;
      let ri = Math.floor(rdx);
      if (ri < 0) ri = 0; else if (ri > RD_COUNT - 2) ri = RD_COUNT - 2;
      let rf = rdx - ri; if (rf < 0) rf = 0; else if (rf > 1) rf = 1;
      this.ri = ri; this.rf = rf; this.sm = e.sineMix;
      const deriv = e.sourceDeriv;
      const lvl = mipLevel(pulse);
      this.tab = deriv ? T.derivMip[lvl] : T.flowMip[lvl];
      this.subTab = deriv ? T.derivMip[mipLevel(per * 2)] : T.flowMip[mipLevel(per * 2)];
      this.sTab = deriv ? T.sDeriv : T.sFlow;
      this.amp = amp;
      this.inc = 1 / pulse;
      this.pulse = pulse;
      this.per = per;
      this.lastF0 = e.srOS / per;
      this.lastRd = Math.exp(e.lnRd);
      const oq = (T.te[ri] + (T.te[ri + 1] - T.te[ri]) * rf) * (1 - this.sm) + this.sm;
      this.lastOq = oq * pulse / per;
      if (this === e.vizVoice) e.vizCycle();
    }

    render(n) {
      const e = this.e, P = e.p, T = e.tables, buf = e.osBuf;
      const shapeT = T.shape, sShape = T.sShape;
      const subRow = e.subRow * TW;
      const isViz = this === e.vizVoice;
      const sr = e.sr;
      const aInc = 1 / (Math.max(P.attack, 0.001) * sr);
      const dCoef = Math.exp(-4.6 / (Math.max(P.decay, 0.001) * sr));
      const rCoef = Math.exp(-4.6 / (Math.max(P.release, 0.001) * sr));
      const S = P.sustain;
      const rVoic = e.rVoicing, rSt = e.rSteady, rPu = e.rPulse, rBr = e.rBright, rGr = e.rGrowl;
      const a1 = e.nA1, a2 = e.nA2, a3 = e.nA3, ar = e.rA, roughG = e.roughGain;
      const g1 = e.nG1, g2 = e.nG2;
      let o = 0;
      for (let j = 0; j < n; j++) {
        // envelope (host rate)
        switch (this.stage) {
          case 1: this.env += aInc; if (this.env >= 1) { this.env = 1; this.stage = 2; } break;
          case 2: this.env = S + (this.env - S) * dCoef; if (Math.abs(this.env - S) < 1e-4) { this.env = S; this.stage = 3; } break;
          case 3: this.env = S; break;
          case 4: this.env *= rCoef; if (this.env < 1e-5) { this.env = 0; this.stage = 0; } break;
        }
        if (this.glideLeft > 0) { this.logF += this.glideStep; this.glideLeft--; }
        const gain = this.env * this.vel;
        const voicing = rVoic[j], steady = rSt[j], pulsed = rPu[j], bright = rBr[j], growl = rGr[j];
        const subInc = Math.exp(this.logF + e.pitchLog) * 0.5 / e.srOS;
        for (let q = 0; q < OS; q++, o++) {
          if (this.cyc >= this.per) {
            this.cyc -= this.per;
            this.startCycle();
            if (this.cyc >= this.per) this.cyc = 0;
          }
          let g = 0, sh = 0;
          if (this.cyc < this.pulse) {
            const x = this.cyc * this.inc * TN, i = x | 0, fr = x - i;
            const b0 = this.ri * TW + i, b1 = b0 + TW;
            const tab = this.tab;
            const v0 = tab[b0] + (tab[b0 + 1] - tab[b0]) * fr;
            const v1 = tab[b1] + (tab[b1 + 1] - tab[b1]) * fr;
            let v = v0 + (v1 - v0) * this.rf;
            sh = shapeT[b0] + (shapeT[b0 + 1] - shapeT[b0]) * fr;
            if (this.sm > 0) {
              const st = this.sTab;
              const s = st[i] + (st[i + 1] - st[i]) * fr;
              v += (s - v) * this.sm;
              const ss = sShape[i] + (sShape[i + 1] - sShape[i]) * fr;
              sh += (ss - sh) * this.sm;
            }
            g = v * this.amp;
          }
          this.cyc += 1;
          const w = this.rand() * 2 - 1;
          let rough = 0;
          if (growl > 0) {
            this.rough += (w - this.rough) * ar;
            rough = this.rough * roughG;
            if (rough > 2.5) rough = 2.5; else if (rough < -2.5) rough = -2.5;
            let gm = 1 + growl * 0.35 * rough;
            if (gm < 0) gm = 0;
            g *= gm;
            // false-fold pulse train an octave below
            this.subPos += subInc;
            if (this.subPos >= 1) this.subPos -= 1;
            const sx = this.subPos * TN, si = sx | 0, sf = sx - si;
            const st = this.subTab || T.flow;
            g += (st[subRow + si] + (st[subRow + si + 1] - st[subRow + si]) * sf) * growl * 0.4 * (1 + 0.25 * rough);
          }
          // breath noise: soft /h/ ↔ bright whisper, steady + pulsed by the glottal opening
          this.n1 += (w - this.n1) * a1;
          this.n2 += (w - this.n2) * a2;
          const soft = this.n1 * g1, hi = (w - this.n2) * g2;
          this.n3 += (soft + (hi - soft) * bright - this.n3) * a3;   // gentle air roll-off
          const noise = this.n3;
          const nAmp = steady + pulsed * sh;
          const voiced = g * voicing;
          buf[o] += (voiced + noise * nAmp) * gain;
          if (isViz) e.vizPush(voiced, nAmp);
        }
      }
    }
  }

  /* ---------- engine ---------- */

  function ramp(arr, a, b, n) {
    const st = (b - a) / n;
    for (let j = 0; j < n; j++) arr[j] = a + st * (j + 1);
    return b;
  }

  class ThroatEngine {
    constructor(sampleRate, seed) {
      this.sr = sampleRate;
      this.srOS = sampleRate * OS;
      this.tables = buildTables();
      this.subRow = Math.round((RD_SUB - RD_LO) / RD_STEP);
      this.p = {};
      for (const k in PARAMS) this.p[k] = PARAMS[k].def;
      this.s = { voicing: 1, breathy: 0, tense: 0, creaky: 0, thin: 0, growl: 0 };   // smoothed knobs
      this.smoothCoef = 1 - Math.exp(-BLOCK / (0.02 * sampleRate));
      this.lnRd = Math.log(RD_MODAL); this.sineMix = 0; this.sourceDeriv = false;
      this.pitchLog = 0;
      this.voices = [];
      const base = (seed >>> 0) || 0x9e3779b9;
      for (let i = 0; i < MAX_VOICES; i++) this.voices.push(new Voice(this, (base + i * 0x6d2b79f5) >>> 0));
      this.ageCounter = 0;
      this.stack = [];           // mono note stack (preallocated use only via push/splice of small ints)
      this.osBuf = new Float32Array(BLOCK * OS);
      this.blk = new Float32Array(BLOCK); this.blkPos = BLOCK;
      this.rVoicing = new Float32Array(BLOCK); this.rSteady = new Float32Array(BLOCK);
      this.rPulse = new Float32Array(BLOCK); this.rBright = new Float32Array(BLOCK);
      this.rGrowl = new Float32Array(BLOCK); this.rVol = new Float32Array(BLOCK);
      this.cur = { voicing: 1, steady: 0, pulse: 0, bright: 0.35, growl: 0, vol: Math.pow(10, PARAMS.volume.def / 20) };
      // noise filters (at the 4x rate)
      const op = hz => 1 - Math.exp(-2 * Math.PI * hz / this.srOS);
      this.nA1 = op(NOISE_SOFT_HZ); this.nA2 = op(NOISE_BRIGHT_HZ); this.nA3 = op(NOISE_AIR_HZ); this.rA = op(ROUGH_HZ);
      const sdU = 1 / Math.sqrt(3);
      this.roughGain = 1 / (sdU * Math.sqrt(this.rA / (2 - this.rA)));
      this.nG1 = NOISE_SOFT_GAIN;
      this.nG2 = NOISE_BRIGHT_GAIN;
      // decimator
      this.fir = designFir();
      this.hist = new Float32Array(FIR_LEN * 2);
      this.hw = 0;
      // DC blocker
      this.dcR = 1 - 2 * Math.PI * 20 / sampleRate;
      this.dcX = 0; this.dcY = 0;
      // live view capture
      this.vizVoice = null;
      this.capG = new Float32Array(65536); this.capN = new Float32Array(65536);
      this.capLen = 0; this.capCycles = 0;
      this.vizG = new Float32Array(256); this.vizN = new Float32Array(256);
      this.vizReady = false; this.vizInfo = { f0: 0, rd: 1, oq: 0, voices: 0 };
    }

    setParam(id, v) {
      const d = PARAMS[id];
      if (!d) return;
      v = +v;
      if (!(v === v)) return;
      if (v < d.min) v = d.min; else if (v > d.max) v = d.max;
      if (id === 'mode') {
        v = v >= 0.5 ? 1 : 0;
        if (v !== this.p.mode) { this.allNotesOff(); this.stack.length = 0; }
      }
      if (id === 'source') v = v >= 0.5 ? 1 : 0;
      this.p[id] = v;
    }

    velAmp(vel) { const v = Math.max(1, Math.min(127, vel)) / 127; return v; }

    noteOn(note, vel) {
      const va = this.velAmp(vel == null ? 100 : vel);
      if (this.p.mode === 0) {
        const v = this.voices[0];
        const legato = this.stack.length > 0;
        const i = this.stack.indexOf(note);
        if (i >= 0) this.stack.splice(i, 1);
        this.stack.push(note);
        v.setTarget(note, true);
        if (!legato || v.stage === 0 || v.stage === 4) v.trigger(va); else v.vel = va;
        this.vizVoice = v;
      } else {
        let v = null;
        for (const x of this.voices) if (x.active && x.note === note) { v = x; break; }
        if (!v) for (const x of this.voices) if (!x.active) { v = x; break; }
        if (!v) {   // steal: quietest releasing voice, else the oldest
          let best = null;
          for (const x of this.voices) if (x.stage === 4 && (!best || x.env < best.env)) best = x;
          if (!best) for (const x of this.voices) if (!best || x.age < best.age) best = x;

    const p = PD.normalise(JSON.parse(JSON.stringify(pond))).pond, name = PD.exportName(p);
    let file = null;
    if (STREAMS) {
      try {
        const h = await window.showSaveFilePicker({ suggestedName: name + '.wav', types: [{ description: 'WAV audio', accept: { 'audio/wav': ['.wav'] } }] });
        file = await h.createWritable();
      } catch (e) { if (e && e.name === 'AbortError') return; setStatus('Could not open the file: ' + e.message, true); return; }
    }
    let stopped = false;
    exporting = { stop: () => { stopped = true; } };
    exGo.disabled = true; renderBtn.disabled = true; exCancel.textContent = 'Stop'; exProg.style.display = 'block'; exBar.style.width = '0';
    const t = performance.now(), parts = [];
    try {
      const info = await job({ type: 'exportStart', pond: p });
      let r;
      do {
        r = await job({ type: 'exportStep', seconds: 10 });
        if (stopped) break;
        if (file) await file.write(r.bytes); else parts.push(r.bytes);
        exBar.style.width = (r.progress * 100) + '%';
        setStatus('Exporting ' + Math.round(r.progress * 100) + '%');
      } while (!r.done);
      if (stopped) {
        await job({ type: 'exportStop' });
        if (file) await file.abort().catch(() => {});
        setStatus('Export stopped');
      } else {
        if (file) { await file.write({ type: 'write', position: 0, data: r.header }); await file.close(); }
        else {
          parts[0].set(r.header, 0);
          const u = URL.createObjectURL(new Blob(parts, { type: 'audio/wav' }));
          download(u, info.fileName); setTimeout(() => URL.revokeObjectURL(u), 60000);
        }
        if (exPond.checked) savePondFile(p, info.base);
        setStatus('Exported ' + info.fileName + (exPond.checked ? ' and its pond file' : '') + ' in ' + ((performance.now() - t) / 1000).toFixed(1) + ' s');
        sheet.hidden = true;
      }
    } catch (e) {
      if (file) await file.abort().catch(() => {});
      setStatus('Could not export: ' + e.message, true);
    }
    exporting = null; exCancel.textContent = 'Cancel'; exProg.style.display = 'none'; renderBtn.disabled = false; showExport();
  });

  // ---------- files ----------
  function download(url, name) { const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); }
  document.getElementById('save').addEventListener('click', () => {
    const u = URL.createObjectURL(new Blob([PD.serialise(pond)], { type: 'application/json' }));
    download(u, PD.fileName(pond)); setTimeout(() => URL.revokeObjectURL(u), 5000);
    dirty = false; showName(); setStatus('Saved ' + PD.fileName(pond));
  });
  document.getElementById('load').addEventListener('click', () => { fileTarget = null; fileIn.click(); });
  fileIn.addEventListener('change', () => { const f = fileIn.files[0]; fileIn.value = ''; if (f) readFile(f, fileTarget); });
  // a krill WAV carries the pond it was made from in its krll chunk (before the audio)
  function readWav(f) {
    f.slice(0, 4 << 20).arrayBuffer().then(buf => {
      let info; try { info = K.wav.parse(new Uint8Array(buf)); } catch (e) { setStatus(f.name + ' is not a WAV file', true); return; }
      if (!info.meta || !info.meta.pond) { setStatus(f.name + ' was not made by krill, so it has no pond in it', true); return; }
      const p = info.meta.pond;
      if (info.meta.seconds) p.output = Object.assign({}, p.output, { minutes: info.meta.seconds / 60 });
      loadPond(p); setStatus('Opened the pond from ' + f.name);
    });
  }
  function readFile(f, slot) {
    f.slice(0, 12).arrayBuffer().then(b => {       // a WAV by its contents, whatever its name
      const u = new Uint8Array(b), id = o => String.fromCharCode(u[o], u[o + 1], u[o + 2], u[o + 3]);
      if (u.length === 12 && id(0) === 'RIFF' && id(8) === 'WAVE') { if (slot == null) readWav(f); else setStatus('A WAV opens as a pond: use Load…', true); }
      else readJson(f, slot);
    });
  }
  function readJson(f, slot) {
    f.text().then(txt => {
      let o; try { o = JSON.parse(txt); } catch (e) { setStatus(f.name + ' is not JSON', true); return; }
      try {
        if (o.format === PD.FORMAT && slot == null) { loadPond(o); setStatus('Loaded ' + f.name); }
        else if (o.format !== PD.FORMAT) {
          const i = slot != null ? slot : pond.slots.findIndex(s => !s);
          if (i < 0) { setStatus('All six slots are full', true); return; }
          putCreature(i, o);
        } else setStatus('That is a pond file; use Load… to open it', true);
      } catch (e) { setStatus(f.name + ': ' + e.message, true); }
    });
  }
  function loadPond(o) { const r = PD.normalise(o); pond = r.pond; dirty = false; refreshAll(); save(); rescore(); if (r.warnings.length) setStatus('Fixed: ' + r.warnings.join('; '), true); return r.warnings; }
  document.addEventListener('dragover', e => { e.preventDefault(); document.body.classList.add('dropping'); });
  document.addEventListener('dragleave', e => { if (!e.relatedTarget) document.body.classList.remove('dropping'); });
  document.addEventListener('drop', e => { e.preventDefault(); document.body.classList.remove('dropping'); const f = e.dataTransfer.files[0]; if (f) readFile(f, null); });
  document.getElementById('example').addEventListener('click', () => { loadPond(window.KRILL_POND_EXAMPLE); setStatus('Example pond loaded'); });
  document.getElementById('new').addEventListener('click', () => { loadPond(PD.defaults({ name: 'Pond', seed: randomSeed() })); dirty = true; showName(); setStatus('New empty pond: add creatures to the slots'); });

  // ---------- start ----------
  let start = null;
  try { start = JSON.parse(localStorage.getItem(STORE)); } catch (e) { start = null; }
  try { if (start) pond = PD.normalise(start).pond; } catch (e) { pond = example(); }
  refreshAll(); rescore();
  window.krillPond = { get pond() { return pond; }, get score() { return score; }, load: loadPond, rescore };   // for tests
})();
</script>
